
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
<title>IL Mano Gallery | Video Experience</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: #000000;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 20px;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      letter-spacing: 3px;
      margin-bottom: 40px;
    }
    video {
      width: 100%;
      max-height: 75vh;
      background: black;
      border-radius: 8px;
    }
    p { color: #aaa; }
.home-logo {
  font-family: "Cormorant Garamond", "Times New Roman", serif;
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #000000;
  text-decoration: none;
  cursor: pointer;
}

.home-logo:hover {
  opacity: 0.6;
}
  </style>
</head>
<body>
  <main>
    <h1>
  <a href="/" class="home-logo">IL MANO GALLERY</a>
</h1>
    <video id="video" controls playsinline preload="metadata">
    </video>
    <p id="message"></p>
  </main>
  <script>
    const id = new URLSearchParams(
      window.location.search
    ).get("id");

    const valid = /^(0[1-9])$/.test(id || "");
    const player = document.getElementById("video");
    const message = document.getElementById("message");

    if (valid) {
      player.src = "https://ilmanogallery.com/assets/videos/" + id + ".mp4";
      player.addEventListener("error", () => {
        message.textContent = "Video unavailable.";
      });
    } else {
      message.textContent = "Invalid video link.";
      player.hidden = true;
    }
  </script>
</body>
</html>
