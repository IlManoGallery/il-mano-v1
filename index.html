  <link rel="preload" as="image" href="assets/opt/0619-0957_losangeles-900.webp" imagesrcset="assets/opt/0619-0957_losangeles-480.webp 480w, assets/opt/0619-0957_losangeles-900.webp 900w, assets/opt/0619-0957_losangeles-1400.webp 1400w" imagesizes="100vw" fetchpriority="high" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Intro sequence: first visit per session only. Adds html.intro (loader + hidden hero
       states), holds the curtain until fonts + hero image decoded + hero mounted, then
       starts the timeline (html.intro-run), hero reveal (.intro-hero) and unlocks scroll. -->
  <script>
  (function () {
    var d = document.documentElement;
    try {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      if (location.hash) return;
      if (sessionStorage.getItem("ilmano-intro")) return;
      sessionStorage.setItem("ilmano-intro", "1");
    } catch (e) {}
    d.classList.add("intro");
    var started = false, noop = function () {};
    function go() {
      if (started) return; started = true;
      d.classList.add("intro-run");
      setTimeout(function () { d.classList.add("intro-hero"); }, 1950);
      setTimeout(function () {
        d.classList.add("intro-done");
        var l = document.getElementById("intro-loader");
        if (l) l.remove();
      }, 4500);
    }
    var img = new Image();
    img.sizes = "100vw";
    img.srcset = "assets/opt/0619-0957_losangeles-480.webp 480w, assets/opt/0619-0957_losangeles-900.webp 900w, assets/opt/0619-0957_losangeles-1400.webp 1400w";
    img.src = "assets/opt/0619-0957_losangeles-900.webp";
    var imgReady = img.decode ? img.decode().catch(noop)
      : new Promise(function (r) { img.onload = img.onerror = r; });
    var fontsReady = document.fonts
      ? Promise.all([document.fonts.load('400 64px "Cormorant Garamond"'),
                     document.fonts.load('400 11px "DM Mono"')]).catch(noop)
      : Promise.resolve();
    var mounted = new Promise(function (r) {
      (function poll() {
        if (document.querySelector(".hero__media img")) r(); else setTimeout(poll, 40);
      })();
    });
    Promise.all([imgReady, fontsReady, mounted]).then(go);
    setTimeout(go, 8000); // never hold the curtain forever
  })();
  </script>
</head>
